<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد حكيم الصوتي</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:20px}
.card{border:2px solid #d4af37;border-radius:25px;padding:25px;max-width:400px;margin:20px auto;background:#111}
#time{font-size:58px;font-weight:bold;color:#d4af37;line-height:1.1}
#ms{font-size:32px;color:#aaa}
button{background:#d4af37;color:#000;border:none;padding:15px 30px;border-radius:15px;font-size:20px;font-weight:bold;margin:8px;min-width:110px}
button.stop{background:#333;color:#fff}
#status{margin-top:15px;color:#0f0}
#micBox{margin-top:15px;border:1px dashed #d4af37;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div class="card" id="card">
<h2>⏱️ عداد حكيم</h2>
<div id="time">00:00:00<br><span id="ms">000</span></div>
<div>
<button id="mainBtn">اشتغل</button>
<button class="stop" id="resetBtn">تصفير</button>
</div>
<div id="micBox">
🎤 كول "اوكف" يوكف - كول "كمل" يكمل<br>
<button style="margin-top:10px;font-size:14px;padding:8px 15px" id="voiceBtn">شغل المايك 🎙️</button>
<div id="status">المايك مطفي</div>
</div>
</div>
<script>
let startTime=0,elapsed=0,timer=null,running=false;
const mainBtn=document.getElementById('mainBtn');
const timeDiv=document.getElementById('time');
const statusEl=document.getElementById('status');
function fmt(d){
let h=Math.floor(d/3600000)%24,m=Math.floor(d/60000)%60,s=Math.floor(d/1000)%60,ms=d%1000;
return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}<br><span id="ms">${String(ms).padStart(3,'0')}</span>`;
}
function update(){let diff=running?elapsed+(Date.now()-startTime):elapsed;timeDiv.innerHTML=fmt(diff);}
function start(){if(!running){startTime=Date.now();running=true;timer=setInterval(update,33);mainBtn.textContent="اوكف";mainBtn.style.background="#c00";mainBtn.style.color="#fff";}}
function pause(){if(running){elapsed+=Date.now()-startTime;running=false;clearInterval(timer);mainBtn.textContent="كمل";mainBtn.style.background="#d4af37";mainBtn.style.color="#000";}}
function reset(){elapsed=0;running=false;clearInterval(timer);update();mainBtn.textContent="اشتغل";mainBtn.style.background="#d4af37";}
mainBtn.onclick=()=>running?pause():start();
document.getElementById('resetBtn').onclick=reset;
document.getElementById('card').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')running?pause():start();});
setInterval(update,33);update();
function startVoice(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){statusEl.textContent="المتصفح ما يدعم الصوت";return;}
let rec=new SR();rec.lang='ar-IQ';rec.continuous=true;rec.interimResults=false;
rec.onstart=()=>{statusEl.textContent="🎧 دا اسمعك... كول اوكف / كمل";};
rec.onresult=e=>{
let t=e.results[e.results.length-1][0].transcript.trim().toLowerCase();
statusEl.textContent="سمعت: "+t;
if(t.includes("اوكف")||t.includes("وقف")||t.includes("وكف")||t.includes("stop")){pause();}
if(t.includes("كمل")||t.includes("اشتغل")||t.includes("شغل")||t.includes("ابد")||t.includes("start")){start();}
if(t.includes("صفر")){reset();}
};
rec.onend=()=>{try{rec.start();}catch{}};
rec.start();
}
document.getElementById('voiceBtn').onclick=startVoice;
</script>
</body>
  </html>
