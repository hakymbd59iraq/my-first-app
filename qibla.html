<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوصلة القبلة - حكيم</title>
<style>
body{background:#000;color:#d4af37;text-align:center;font-family:sans-serif;padding:20px;margin:0}
.card{border:2px solid #d4af37;border-radius:25px;padding:20px;max-width:380px;margin:auto;background:#0a0a0a}
.compass{width:260px;height:260px;border:3px solid #d4af37;border-radius:50%;margin:20px auto;position:relative;background:radial-gradient(#222,#000)}
#arrow{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:90px solid #d4af37;position:absolute;top:15px;left:50%;transform:translateX(-50%) rotate(0deg);transform-origin:50% 115px;transition:0.15s}
#kaaba{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:38px}
h1{margin:10px 0}
#deg{font-size:32px;margin:10px}
button{background:#d4af37;color:#000;border:none;padding:14px 28px;border-radius:14px;font-size:19px;font-weight:bold}
#msg{margin:15px;color:#fff}
</style>
</head>
<body>
<div class="card">
<h1>🕋 بوصلة القبلة</h1>
<p>اتجاه القبلة من السليمانية</p>
<div class="compass">
<div id="arrow"></div>
<div id="kaaba">🕋</div>
</div>
<h2 id="deg">0°</h2>
<p id="msg">دوس تفعيل البوصلة</p>
<button onclick="start()">تفعيل البوصلة 🧭</button>
</div>
<script>
const QIBLA=195;
function start(){
 if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
  DeviceOrientationEvent.requestPermission().then(p=>{
   if(p==='granted'){window.addEventListener('deviceorientation',handle,true); document.getElementById('msg').innerText='حرك التلفون ببطء';}
  });
 }else{
  window.addEventListener('deviceorientation',handle,true);
  document.getElementById('msg').innerText='حرك التلفون ببطء';
 }
}
function handle(e){
 let h=e.webkitCompassHeading||(360-e.alpha);
 if(h!=null){
  let q=QIBLA-h;
  document.getElementById('arrow').style.transform=`translateX(-50%) rotate(${q}deg)`;
  document.getElementById('deg').innerText=Math.round(h)+'°';
  if(Math.abs(q)<12){document.getElementById('msg').innerText='✅ انت باتجاه القبلة - الله أكبر'; document.getElementById('msg').style.color='#d4af37';}
  else{document.getElementById('msg').innerText='ابحث عن علامة 🕋'; document.getElementById('msg').style.color='#fff';}
 }
}
</script>
</body>
  </html>
