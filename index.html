<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوصلة القبلة السوداء</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:20px}
.card{background:#101010;padding:20px;border-radius:20px;max-width:350px;margin:auto}
#compass{width:270px;height:270px;border:3px solid #facc15;border-radius:50%;margin:20px auto;position:relative;background:radial-gradient(circle,#222,#000)}
#arrow{position:absolute;top:50%;left:50%;width:4px;height:120px;background:#facc15;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);border-radius:10px;transition:transform 0.2s}
#arrow:after{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid #facc15}
#kaaba{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px}
button{width:100%;padding:14px;background:#facc15;color:#000;border:0;border-radius:12px;font-weight:bold;font-size:18px}
#info{color:#facc15;margin:15px 0;font-size:20px;font-weight:bold}
.qibla-dot{position:absolute;width:14px;height:14px;background:#facc15;border-radius:50%;box-shadow:0 0 10px #facc15}
</style>
</head>
<body>
<div class="card">
<h2>🕋 بوصلة القبلة</h2>
<div id="info">اضغط لتحديد القبلة</div>
<div id="compass">
<div id="kaaba">🕋</div>
<div id="arrow"></div>
</div>
<button onclick="startCompass()">تفعيل البوصلة</button>
<p style="opacity:0.6;font-size:13px;margin-top:15px">وجه السهم الأصفر نحو الكعبة - ضع الهاتف بشكل أفقي</p>
</div>

<script>
let qiblaAngle = 0;
const kaabaLat = 21.4225;
const kaabaLng = 39.8262;

function calcQibla(lat,lng){
const phiK = kaabaLat*Math.PI/180;
const lambdaK = kaabaLng*Math.PI/180;
const phi = lat*Math.PI/180;
const lambda = lng*Math.PI/180;
const delta = lambdaK-lambda;
const y = Math.sin(delta);
const x = Math.cos(phi)*Math.tan(phiK)-Math.sin(phi)*Math.cos(delta);
let q = Math.atan2(y,x)*180/Math.PI;
return (q+360)%360;
}

function startCompass(){
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
qiblaAngle = calcQibla(pos.coords.latitude, pos.coords.longitude);
document.getElementById('info').innerText = 'اتجاه القبلة: ' + Math.round(qiblaAngle) + '° - حرك الهاتف';
if(window.DeviceOrientationEvent){
if(typeof DeviceOrientationEvent.requestPermission === 'function'){
DeviceOrientationEvent.requestPermission().then(r=>{
if(r=='granted') window.addEventListener('deviceorientation', handleOrientation, true);
}).catch(()=>{});
}else{
window.addEventListener('deviceorientation', handleOrientation, true);
}
}
},()=>{alert('فعل الموقع GPS');});
}else{alert('المتصفح لا يدعم الموقع');}
}

function handleOrientation(e){
let heading = e.webkitCompassHeading || (360 - e.alpha);
if(heading){
let finalAngle = qiblaAngle - heading;
document.getElementById('arrow').style.transform = `translate(-50%,-100%) rotate(${finalAngle}deg)`;
}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
