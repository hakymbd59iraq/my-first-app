<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوصلة القبلة السوداء</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#101010;padding:20px;border-radius:20px;text-align:center;border:1px solid #222;width:90%;max-width:350px}
#compass{width:270px;height:270px;border-radius:50%;border:6px solid #222;margin:15px auto;position:relative;background:radial-gradient(circle,#1a1a1a,#000)}
#arrow{position:absolute;top:50%;left:50%;width:4px;height:110px;background:#ff3b30;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);border-radius:10px;z-index:2}
#arrow:after{content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #ff3b30}
#kaaba{position:absolute;top:50%;left:50%;width:32px;height:32px;background:#000;border:2px solid #facc15;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:20px}
button{width:100%;padding:14px;background:#facc15;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin-top:10px}
#info{color:#facc15;margin:15px 0;font-size:16px;min-height:24px}
.qibla-dot{position:absolute;width:14px;height:14px;background:#facc15;border-radius:50%;top:20px;left:50%;transform:translateX(-50%);box-shadow:0 0 10px #facc15}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:5px">🕋 بوصلة القبلة</h2>
<div id="info">دوس تفعيل البوصلة</div>
<div id="compass">
<div class="qibla-dot"></div>
<div id="arrow"></div>
<div id="kaaba">🕋</div>
</div>
<button onclick="startCompass()">تفعيل البوصلة 🧭</button>
<p style="font-size:13px;color:#888;margin-top:15px">وجه النقطة الصفراء + السهم الأحمر للقبلة<br>ضع الهاتف بشكل مسطح</p>
</div>
<script>
let qiblaAngle=0;
function calcQibla(lat,lon){
const kaabaLat=21.4225*Math.PI/180;
const kaabaLon=39.8262*Math.PI/180;
const phi=lat*Math.PI/180;
const lambda=lon*Math.PI/180;
const y=Math.sin(kaabaLon-lambda);
const x=Math.cos(phi)*Math.tan(kaabaLat)-Math.sin(phi)*Math.cos(kaabaLon-lambda);
let q=Math.atan2(y,x)*180/Math.PI;
return (q+360)%360;
}
function startCompass(){
const info=document.getElementById('info');
if(!navigator.geolocation){info.textContent='الموقع غير مدعوم';return;}
info.textContent='جاري تحديد موقعك...';
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude;
const lon=pos.coords.longitude;
qiblaAngle=calcQibla(lat,lon);
info.textContent=`اتجاه القبلة: ${qiblaAngle.toFixed(0)}° من الشمال`;
if('DeviceOrientationEvent' in window){
if(typeof DeviceOrientationEvent.requestPermission==='function'){
DeviceOrientationEvent.requestPermission().then(res=>{
if(res==='granted'){window.addEventListener('deviceorientation',handleOrientation,true);info.textContent+=' | حرك الهاتف';}
}).catch(()=>{info.textContent='اسمح بالبوصلة من الاعدادات';});
}else{
window.addEventListener('deviceorientation',handleOrientation,true);
}
}else{info.textContent+=' | جهازك لا يدعم البوصلة، استخدم الزاوية';}
},()=>{info.textContent='فعل الـ GPS والموقع';},{enableHighAccuracy:true});
}
function handleOrientation(e){
let heading=0;
if(e.webkitCompassHeading){heading=e.webkitCompassHeading;}
else if(e.alpha){heading=360-e.alpha;}
document.getElementById('arrow').style.transform=`translate(-50%,-100%) rotate(${qiblaAngle-heading}deg)`;
}
</script>
</body>
  </html>
