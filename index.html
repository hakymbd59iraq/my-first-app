<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>بوصلة القبلة</title><style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:20px}.circle{width:280px;height:280px;border:5px solid #ffcc00;border-radius:50%;margin:30px auto;position:relative;background:#111}#arrow{position:absolute;top:15px;left:50%;font-size:40px;transform:translateX(-50%)}#kaaba{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px}button{background:#ffcc00;color:#000;border:0;padding:15px 30px;font-size:20px;border-radius:12px;font-weight:bold}</style></head><body><h1 style="color:#ffcc00">🕋 بوصلة القبلة</h1><p>اتجاه القبلة من السليمانية</p><div class="circle"><div id="arrow">⬆️</div><div id="kaaba">🕋</div></div><h2 id="info">--</h2><button onclick="start()">تفعيل البوصلة</button><script>let qibla=196;function start(){if(DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(r=>{if(r=='granted')window.addEventListener('deviceorientation',go)})}else window.addEventListener('deviceorientation',go)}function go(e){let h=e.webkitCompassHeading||(360-e.alpha);let d=h-qibla;document.getElementById('arrow').style.transform=`translateX(-50%) rotate(${-d}deg)`;let t=document.getElementById('info');t.innerText=Math.abs(d)<5?'✅ انت باتجاه القبلة':Math.round(d)+'° لف';if(Math.abs(d)<5)t.style.color='#0f0'}}</script></body></html>
